last_reviewed: 2026-11-05

principles:
  - State what the evidence establishes, not what we wish it established.
  - Distinguish primary records, later historical accounts, inference, and modern claimant-issued documents.
  - Record gaps and unsuccessful lines of inquiry because negative results prevent duplicated work.
  - Revise conclusions when better evidence appears and preserve a dated account of what changed.
  - Do not substitute family succession, farm ownership, or church patronage for evidence of the lordship's descent.

questions:
  - id: post-1944-succession
    title: How far can the later descent be documented, before and after 1944?
    status: active
    status_label: Active investigation
    known: >-
      Major Chandos Brydges Lee-Warner died in 1944, but his proposed tenure
      as lord has not been proved. Earlier nineteenth-century links also
      require documentary evidence; 1944 is an investigative waypoint.
    needed: >-
      Probate and residuary-estate records, conveyances involving Dane John Farm,
      family papers, and any deed by which the incorporeal lordship was separately assigned.

  - id: tyberton-branch
    title: Can the nineteenth-century Tyberton succession be proved instrument by instrument?
    status: active
    status_label: Active investigation
    known: >-
      Published accounts, church patronage, and catalogued Donjon Farm leases
      provide leads toward the Tyberton branch. The leases have not been
      inspected for this project and do not yet establish transfers of the lordship.
    needed: >-
      Inspection and transcription of the relevant Tyberton Court muniments,
      including parties, parcels, terms, and any express lordship wording;
      wills, assents, marriage settlements, and property schedules.

  - id: medieval-gap
    title: What fills the gaps in the medieval and early Tudor descent?
    status: open
    status_label: Source search
    known: >-
      The Chiche tenure and later Hales tenure are reported by Hasted, but several
      individual transitions are compressed or absent from the printed narrative.
    needed: >-
      Canterbury Cathedral Archives, civic rolls, St Mary Bredin material,
      inquisitions post mortem, feet of fines, and surviving court rolls.

  - id: manor-boundaries
    title: What were the manor's boundaries and surviving buildings at different dates?
    status: open
    status_label: Reconstruction
    known: >-
      The mansion stood outside the city wall and the mound inside it.
      Kent HER MKE24851 places the mansion parallel to Dane John Works on
      its city-facing side. MKE86264 locates a demolished outfarm nearby,
      but does not establish an estate connection or its boundaries.
    needed: >-
      Inspect the CAT Annual Report 1977–78, page 12, and Canterbury City
      Council/RCHME Historic Buildings Survey 57025. Compare their plans with
      estate, railway, valuation, and farmstead mapping and deeds containing
      parcels or abuttals. Distinguish the two demolition episodes and test,
      rather than assume, the outfarm's connection with the manor.

  - id: archaeological-reports
    title: What do the original excavation and mound-survey reports establish?
    status: active
    status_label: Report inspection
    known: >-
      Reviewed HER summaries describe the 1981 excavation at 15a Dane John
      and a July 1996 measured survey of the mound. Their report references
      have been verified, but the original reports have not been inspected.
    needed: >-
      Obtain and inspect Rady's Dane John Site (1982), SKE30883, and Jarman's
      The Dane John Mound (catalogued 1999), SKE30886. Check plans, section
      drawings, dating evidence, and the relationship between the castle,
      later drainage, garden deposits, and alterations to the mound.

  - id: simmons-monument-date
    title: Was the summit monument erected in 1803 or 1830?
    status: open
    status_label: Conflicting sources
    known: >-
      Historic England's gardens entry 1001360 gives 1803; its pinnacle
      entry 1085047 gives 1830. The site retains 1803 provisionally and
      makes the conflict explicit rather than treating either record as decisive.
    needed: >-
      Contemporary civic minutes and accounts, early descriptions, and
      inscription evidence. Separate the date of landscaping commemorated
      on the monument from the date when the monument itself was erected.

  - id: possessory-theory
    title: What legal effect, if any, does the 2024 possessory-title theory have?
    status: evaluated
    status_label: Evidence evaluated
    known: >-
      The issuer relies on constructive possession and the possession of documents.
      Public guidance confirms that genuine manorial lordships are incorporeal property,
      but no authority located establishes that an unrelated party can create ownership
      of a particular historical lordship through the process described.
    needed: >-
      A reported judgment, authoritative practitioner analysis, or complete historical
      root of title supporting the application of that theory to this lordship.

