  - source: Major Chandos Brydges Lee-Warner probate and residuary estate
    date: 1944
    status: next
    status_label: Next inquiry
    contribution: May identify the heir or devisee through whom the genuine lordship passed after 1944.

  - source: Finance Act 1910 valuation records, The National Archives, IR 58
    date: 1909–1915
    status: next
    status_label: Next inquiry
    contribution: May identify the contemporary owner and parcel history of Dane John Farm.
