items:
  - period: First–second centuries
    title: The mound before the manor
    subtitle: >-
      The ancient earthwork became a fixed point in Canterbury's landscape,
      old enough for the Roman wall to bend around it.
    link: /history/celtic-origins
  - period: After 1066
    title: A Norman donjon
    subtitle: >-
      The conquerors briefly adapted the mound as a motte-and-bailey
      fortification before the stone castle superseded it.
    link: /history/norman-period
  - period: Twelfth–eighteenth centuries
    title: A manorial seat
    subtitle: >-
      The Chiche, Hales, Sheldon, Lee, and Lee-Warner families carried the
      manor through six centuries of Canterbury life.
    link: /lords-of-the-manor
  - period: 1554–c. 1601
    title: A case reaches Hamlet
    subtitle: >-
      Sir James Hales's death produced a celebrated property case—and an
      argument Shakespeare placed in the mouths of his gravediggers.
    link: /history/james-hales
  - period: From 1790
    title: Dane John Gardens
    subtitle: >-
      Alderman James Simmons transformed the old ground into a public garden,
      preserving the mound within the modern city.
    link: /gardens
